services:
  db:
    image: postgres:18-alpine
    container_name: postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER:-mellith}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mellith}
      POSTGRES_DB: ${DB_NAME:-mellith}
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql
volumes:
  db:
